name: Update figures

# Refreshes docs/figures.json from the OBP API sandbox once a day, and on demand
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the figures
        run: python3 scripts/update_figures.py https://apisandbox.openbankproject.com
      - name: Commit them if they changed
        run: |
          # fetched_at changes every run, so only commit when a figure itself changed
          if git diff --quiet -I '"fetched_at"' -- docs/figures.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures.json
          git commit -m "Update figures from the API sandbox"
          git push
